[project]
name = "anna-inbox-executa"
version = "1.0.2"
description = "Anna Executa mail agent."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
anna-inbox-executa = "anna_inbox_executa.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "anna_inbox_executa",
  "mail_agent",
  "executa_sdk"
]
