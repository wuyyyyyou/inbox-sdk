name: Release Inbox Tool

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-x86_64
            runner: macos-15-intel
          - platform: darwin-arm64
            runner: macos-15
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: windows-x86_64
            runner: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        shell: bash
        run: python -m pip install uv

      - name: Build binary package
        shell: bash
        run: scripts/build/build_binary.sh

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          assets=(dist/inbox-tool/*/inbox-tool-*-${{ matrix.platform }}.*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found for platform ${{ matrix.platform }}" >&2
            exit 1
          fi
          cp "${assets[@]}" release-assets/
          ls -la release-assets

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: inbox-tool-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read inbox-tool version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; from pathlib import Path; manifest = json.loads(Path("inbox-tool/manifest.json").read_text(encoding="utf-8-sig")); version = manifest.get("version"); assert isinstance(version, str) and version.strip(), "inbox-tool/manifest.json must define a non-empty version"; print(version.strip())')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=inbox-tool-v$version" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -print | sort

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --title "inbox-tool $RELEASE_VERSION" \
              --notes "inbox-tool $RELEASE_VERSION binary release"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --title "inbox-tool $RELEASE_VERSION" \
              --notes "inbox-tool $RELEASE_VERSION binary release"
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets downloaded" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GH_REPO" --clobber
